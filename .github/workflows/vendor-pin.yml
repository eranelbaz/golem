# .github/workflows/vendor-pin.yml
name: vendor-pin-check
on: [push, pull_request]
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute vendored-tree content hash
        run: |
          cs() { cd "$1" && find . -path ./.git -prune -o -path ./build -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}'; }
          got=$(cs vendor/llama.cpp)
          want=$(grep '^content_sha256' vendor/VENDOR_SHA | cut -d= -f2)
          test "$got" = "$want" || { echo "PIN DRIFT: $got != $want"; exit 1; }
          grep -q "^content_sha256 = $got" engine/llama-cpp.lock || { echo "lock mismatch"; exit 1; }
          n=$(find vendor/llama.cpp -path vendor/llama.cpp/.git -prune -o -path vendor/llama.cpp/build -prune -o -type f -print | wc -l)
          want_n=$(grep '^file_count' vendor/VENDOR_SHA | cut -d= -f2)
          [ -n "$want_n" ] || { echo "file_count key missing/empty in vendor/VENDOR_SHA"; exit 1; }
          test "$n" = "$want_n" || { echo "FILE COUNT DRIFT: $n != $want_n"; exit 1; }
