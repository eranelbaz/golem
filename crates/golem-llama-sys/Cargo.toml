[package]
name = "golem-llama-sys"
description = "Raw bindings to the vendored llama.cpp fork (tech design section 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
links = "llama-cpp"

# Backend selection is deliberately env-based (`GOLEM_LLAMA_SYS_BACKEND`,
# resolved by build.rs), NOT a cargo feature: the `links = "llama-cpp"` key
# forbids parallel feature variants of a substrate-linking crate in one graph.
[features]
default = []

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
cc.workspace = true
cmake = "0.1"
bindgen = "0.72"
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
