patches = P1+P2+P3+P3copy+P1place+P1ctx+LLctx+P5pred+LLarch+O10excl+P2slabfail+P6abort+P3ensurefail+P4resident+P6srclost+TSgate+P2h2dstats+P3copystream  # P6srclost: prefill-stream source returning GOLEM_STREAM_SRC_STORAGE_LOST fails the compute (ABI v15); TSgate: test seams (golem_inject_slab_alloc_failure) compiled only under GOLEM_TEST_SUPPORT (ABI v15); P2h2dstats: device-cache stats count H2D expert copies (ABI v15); P3copystream: golem_set_async_h2d/golem_take_h2d_timing — pooled + slab H2D on a dedicated HIP copy stream, event-joined with compute (ABI v15); P4resident: golem_device_cache_resident_bytes — live slab + stream-slab device bytes (ABI v14); P6abort: prefill-stream source returning 1 aborts the compute (request cancelled, llama_decode -2) (ABI v11); P3ensurefail: ensure hook returning nonzero (misses unreadable, dead shard) fails the compute instead of aborting (ABI v13); P2slabfail: device-slab alloc failure fails the compute (ALLOC_FAILED, llama_decode -2) instead of aborting; engine resets + lowers K (ABI v12); P3copy: golem_copy_pooled_expert_run — pooled-run H2D copy plan (padding tail = last expert's own bytes, never past the slot); P1place: golem_get_expert_placement_stats — expert MUL_MAT_ID per-backend counters at split (I2 proof); P1ctx: golem_ctx per-model hook context + batched ensure/routing (ABI v5) + sched-attached state; LLctx: llama_golem_model_attach/detach — libllama seam, ctx set on the model, re-applied per sched_reserve; P5pred: golem_pred-<target>-<src> next-layer routing prediction nodes (glm5-next, deepseek41) read in the layer pre-pass + golem_set_predict/predict hook (ABI v6); LLarch: unsloth "glm5next" files fold onto upstream glm5-next, KV prefix = the file's spelling; lazy expert planes (TENSOR_READ_LAZY) in glm5-next + deepseek41; O10excl: evict_dest hook (ABI v7) — exclusive-residency slab evictions D2H into the pool on the split stream (design §6.3 O10)
fa = on                  # validated on gfx1100/ROCm 7.2.4 at the previous pin (unsloth glm5next 86ebfef); -fa on vs off at -ncmoe 45: both coherent, ~48-word common greedy prefix then gradual divergence; ppl-based formal gate and warm/cold tok/s deferred (recipe in docs/baselines/m0-notes.md)
