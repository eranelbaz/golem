name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Plan-mandated (M1.1 task 5): explicit backend pin so the non-vacuous
      # arm of `backend_matches_resolution_rules` executes in CI. The runner
      # has no ROCm, so `auto` would resolve to Cpu anyway — the explicit
      # value makes the auto→Cpu resolution itself asserted, not assumed.
      GOLEM_LLAMA_SYS_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Pinned test-model fixture cache. Source of truth for the cache slot,
      # the pin, and the hash-derived filename:
      # crates/golem-llama-sys/tests/common/mod.rs (fixture sha256 starts
      # 66967fbece6dbe97; slot ~/.cache/golem/test-models/). The key is a
      # hardcoded literal — never runtime-computed. Must precede nextest so
      # the test run finds the fixture pre-seeded (helper prints
      # `fixture-ok: <sha256> <path>` naming this slot on resolution).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/golem/test-models
          key: test-models-66967fbece6dbe97
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # --success-output=immediate: keep `fixture-ok:`/pin-ok stdout of passing
      # tests visible directly in green CI logs (plan's log assertion).
      - run: cargo nextest run --workspace --success-output=immediate
      - uses: EmbarkStudios/cargo-deny-action@v2
