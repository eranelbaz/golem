[package]
name = "golem-server"
description = "Instance process: HTTP server, slot scheduler, decode loop (tech design sections 2 and 7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Fixture path + fault injection for the integration tests.
test-support = ["dep:xtask", "dep:tracing-subscriber", "dep:tower"]

[dependencies]
axum = { workspace = true }
golem-api = { path = "../golem-api" }
golem-engine = { path = "../golem-engine" }
golem-llama-sys = { path = "../golem-llama-sys" }
golem-registry = { path = "../golem-registry" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
xtask = { path = "../../xtask", optional = true }
tower = { workspace = true, optional = true }
golem-store = { path = "../golem-store" }

[dev-dependencies]
golem-gguf = { path = "../golem-gguf" }
golem-server = { path = ".", features = ["test-support"] }
http = { workspace = true }
tower = { workspace = true }
