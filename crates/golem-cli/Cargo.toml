[package]
name = "golem-cli"
description = "golem CLI: run, parity-op, import (tech design section 9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "golem"
path = "src/main.rs"

[features]
# Gates the HIP-only integration test (pooled_parity.rs): the split-
# scheduler expert-copy path only runs where a GPU backend exists — same
# gate as golem-engine's `hip-tests`.
hip-tests = []

[dependencies]
clap = { workspace = true }
golem-engine = { path = "../golem-engine" }
golem-llama-sys = { path = "../golem-llama-sys" }
golem-placement = { path = "../golem-placement" }
golem-store = { path = "../golem-store" }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
xtask = { path = "../../xtask" }

[lints]
workspace = true
