[package]
name = "golem-engine"
description = "Model loading, decode loop, and llama.h glue (tech design section 7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
golem-gguf = { path = "../golem-gguf" }
golem-plan = { path = "../golem-plan" }
golem-llama-sys = { path = "../golem-llama-sys" }
golem-placement = { path = "../golem-placement" }
golem-store = { path = "../golem-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2.workspace = true
sysinfo.workspace = true

[features]
hip-tests = []
test-support = ["golem-llama-sys/test-support"]

[dev-dependencies]
# Integration tests call the `*_for_test` seams.
golem-engine = { path = ".", features = ["test-support"] }
xtask = { path = "../../xtask" }
libc = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
