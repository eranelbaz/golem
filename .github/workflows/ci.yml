name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Triggers above cannot double-run (push is main-only, PRs fire only
# pull_request); this group cancels superseded PR runs but never a main build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOLEM_LLAMA_SYS_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Pinned test-model fixture (see tests/common/mod.rs).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/golem/test-models
          key: test-models-66967fbece6dbe97
          restore-keys: |
            test-models-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Pool-enabled CPU tests mlock a 1 GiB arena (no unlocked fallback,
      # §5.4); the hosted runner's default RLIMIT_MEMLOCK is far below that.
      # Raise it on this step's shell so nextest and its children inherit it.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo nextest run --workspace --success-output=immediate
      # T6 loom leg (§12.2): unfiltered — every non-model test is
      # #[cfg(not(loom))]-gated, so the whole crate must pass under loom.
      # A filter here hid 8 broken tests once; don't reintroduce one.
      - name: T6 loom (placement pool)
        run: RUSTFLAGS="--cfg loom" cargo nextest run -p golem-placement --features loom
      # M1.4 parity-suite leg (stdlib driver): pytest file runs the in-script
      # selftest through the real xtask comparator. Must stay after the
      # workspace build so target/debug/xtask exists (no cargo-run fallback).
      - run: python3 -m pip install --quiet 'pytest==8.4.2'
      - run: python3 -m pytest tests/test_parity_suite.py -q
      - uses: EmbarkStudios/cargo-deny-action@v2

  # M2.1 P1 gate: upstream vendored ctest + unset-hooks byte-identity.
  # No build-substrate.sh (HIP-only, no args): CPU substrate comes from
  # golem-llama-sys/build.rs via GOLEM_LLAMA_SYS_BACKEND=cpu; the gate's
  # cmake build is its own upstream-test tree (one substrate each).
  t4-patch-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOLEM_LLAMA_SYS_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Upstream tests + unset-hooks byte-identity
        run: |
          cargo run -p xtask -- gen-tiny-moe --out /tmp/tiny-moe.gguf
          cargo build -p golem-cli
          scripts/t4_gate.sh --upstream-tests target/debug/golem /tmp/tiny-moe.gguf

  # P3 functional acceptance: the split-scheduler
  # expert-copy path only executes where a GPU split exists, so this leg runs
  # on the self-hosted HIP runner; CPU CI never reaches it. No HIP runner is
  # registered yet, so the job is workflow_dispatch-only — PR CI stays green
  # and the leg runs manually (`gh workflow run ci.yml`) once the runner is up.
  p3-hip:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, hip]
    timeout-minutes: 60
    env:
      GOLEM_LLAMA_SYS_BACKEND: hip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Unfiltered: every hip-tests-gated test (incl. the GPU-offload and
      # second-session invariants) must run, never be filtered out.
      - run: cargo nextest run -p golem-engine --features hip-tests
      # Pooled-vs-unpooled CLI comparison — needs the built `golem`
      # binary, so it lives in golem-cli (engine tests can't see CARGO_BIN_EXE).
      - run: cargo nextest run -p golem-cli --features hip-tests
      # Backend-gated FFI smoke — under the HIP substrate only
      # `hip_decode_runs` compiles (the CPU variant is cfg'd out, never a
      # reported-ok skip).
      - run: cargo nextest run -p golem-llama-sys
