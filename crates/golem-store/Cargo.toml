[package]
name = "golem-store"
description = "Multi-disk mirrored storage, striped reads, checksums (tech design section 5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
crc32c.workspace = true
tracing.workspace = true
# Loom is referenced by lib code (readers.rs) under `cfg(loom)`, so it must be
# a regular optional dependency — a dev-dependency is invisible to the lib
# target and the loom leg would not compile.
loom = { version = "0.7", optional = true }

[features]
loom = ["dep:loom"]

[lints]
workspace = true
