# .github/workflows/vendor-pin.yml
name: vendor-pin-check
on: [push, pull_request]
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute vendored-tree content hash
        run: |
          cs() { cd "$1" && find . -path ./.git -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'; }
          got=$(cs vendor/llama.cpp)
          want=$(grep '^content_sha256' vendor/VENDOR_SHA | cut -d= -f2)
          test "$got" = "$want" || { echo "PIN DRIFT: $got != $want"; exit 1; }
          grep -q "^content_sha256 = $got" engine/llama-cpp.lock || { echo "lock mismatch"; exit 1; }
